<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit My Profile | Employee Skills Summary</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 40px;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 22px;
            padding: 30px 35px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.12);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #475569;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4f46e5;
        }

        input[readonly] {
            background: #f1f5f9;
            color: #64748b;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .buttons {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e2e8f0;

            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .save {
            background: #4f46e5;
            color: white;
        }

        .save:hover {
            background: #4338ca;
        }

        .cancel {
            background: #64748b;
            color: white;
        }

        .cancel:hover {
            background: #475569;
        }

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>✏️ Edit My Profile</h1>

        <p>
            Update your employee information.
        </p>

    </div>


    <!-- FORM -->

    <div class="card">

        <form
                th:action="@{/employee/update}"
                th:object="${employee}"
                method="post">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Employee Name
                </label>

                <input
                        type="text"
                        id="name"
                        th:field="*{name}"
                        required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        readonly>

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <select
                        id="department"
                        th:field="*{department}"
                        required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="IT">
                        IT
                    </option>

                    <option value="HR">
                        HR
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                    <option value="Sales">
                        Sales
                    </option>

                    <option value="Operations">
                        Operations
                    </option>

                </select>

            </div>


            <!-- SKILLS -->

            <div class="form-group">

                <label for="skills">
                    Skills
                </label>

                <textarea
                        id="skills"
                        th:field="*{skills}"
                        placeholder="Example: Java, Spring Boot, MySQL"
                        required>
                </textarea>

            </div>


            <!-- SKILL LEVEL -->

            <div class="form-group">

                <label for="skillLevel">
                    Skill Level
                </label>

                <select
                        id="skillLevel"
                        th:field="*{skillLevel}"
                        required>

                    <option value="">
                        Select Skill Level
                    </option>

                    <option value="Beginner">
                        Beginner
                    </option>

                    <option value="Intermediate">
                        Intermediate
                    </option>

                    <option value="Advanced">
                        Advanced
                    </option>

                    <option value="Expert">
                        Expert
                    </option>

                </select>

            </div>


            <!-- TRAINING -->

            <div class="form-group">

                <label for="trainingNeeded">
                    Training Needed
                </label>

                <select
                        id="trainingNeeded"
                        th:field="*{trainingNeeded}"
                        required>

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                        href="/dashboard"
                        class="btn cancel">

                    ← Cancel

                </a>

                <button
                        type="submit"
                        class="btn save">

                    💾 Save Changes

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
