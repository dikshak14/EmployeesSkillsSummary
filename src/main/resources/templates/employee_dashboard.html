<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Dashboard | Employee Skills Summary</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 22px;
            padding: 30px 35px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.12);
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .profile-card {
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
        }

        .profile-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-title h2 {
            color: #1e293b;
            font-size: 24px;
        }

        .badge {
            background: #eef2ff;
            color: #4f46e5;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 20px;
        }

        .detail-box.full {
            grid-column: span 2;
        }

        .label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .value {
            font-size: 16px;
            color: #1e293b;
            font-weight: 600;
        }

        .skills {
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .training-yes {
            color: #dc2626;
        }

        .training-no {
            color: #16a34a;
        }

        /* ==============================
           ACTION BUTTONS
        ============================== */

        .actions {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e2e8f0;

            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .edit-profile {
            display: inline-block;
            padding: 12px 22px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s;
        }

        .edit-profile:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .logout {
            display: inline-block;
            padding: 12px 22px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s;
        }

        .logout:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail-box.full {
                grid-column: span 1;
            }

            .profile-title {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .actions {
                flex-direction: column;
            }

            .edit-profile,
            .logout {
                text-align: center;
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>👋 Employee Dashboard</h1>

        <p>
            Welcome to your Employee Skills Summary portal.
        </p>

    </div>


    <!-- ERROR -->

    <div class="error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>


    <!-- EMPLOYEE PROFILE -->

    <div class="profile-card"
         th:if="${employee}">

        <div class="profile-title">

            <h2>👤 My Profile</h2>

            <span class="badge">
                Employee
            </span>

        </div>


        <div class="details">


            <!-- NAME -->

            <div class="detail-box">

                <div class="label">
                    Employee Name
                </div>

                <div class="value"
                     th:text="${employee.name}">
                </div>

            </div>


            <!-- EMAIL -->

            <div class="detail-box">

                <div class="label">
                    Email Address
                </div>

                <div class="value"
                     th:text="${employee.email}">
                </div>

            </div>


            <!-- DEPARTMENT -->

            <div class="detail-box">

                <div class="label">
                    Department
                </div>

                <div class="value"
                     th:text="${employee.department}">
                </div>

            </div>


            <!-- SKILL LEVEL -->

            <div class="detail-box">

                <div class="label">
                    Skill Level
                </div>

                <div class="value"
                     th:text="${employee.skillLevel}">
                </div>

            </div>


            <!-- SKILLS -->

            <div class="detail-box full">

                <div class="label">
                    Skills
                </div>

                <div class="value skills"
                     th:text="${employee.skills}">
                </div>

            </div>


            <!-- TRAINING -->

            <div class="detail-box full">

                <div class="label">
                    Training Needed
                </div>

                <div class="value"
                     th:classappend="${employee.trainingNeeded == 'Yes'} ? 'training-yes' : 'training-no'"
                     th:text="${employee.trainingNeeded}">
                </div>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <!-- EDIT MY PROFILE -->

            <a th:href="@{/employee/edit}"
               class="edit-profile">

                ✏️ Edit My Profile

            </a>


            <!-- LOGOUT -->

            <a href="/logout"
               class="logout">

                🚪 Logout

            </a>

        </div>

    </div>

</div>

</body>

</html>
