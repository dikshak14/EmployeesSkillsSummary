<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Skills Summary</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background:
                    linear-gradient(
                            135deg,
                            #162447,
                            #1f4068,
                            #1b6ca8
                    );

            min-height: 100vh;
            padding: 40px;
        }

        .card-box {
            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(20px);

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                    0 20px 50px
                    rgba(0, 0, 0, 0.35);
        }

        h1 {
            color: white;
            font-weight: bold;
        }

        .btn {
            border-radius: 10px;
        }

        .table-container {
            margin-top: 25px;

            border-radius: 15px;

            overflow-x: auto;

            background: white;

            box-shadow:
                    0 10px 25px
                    rgba(0, 0, 0, 0.15);
        }

        .table {
            margin-bottom: 0;
            background: white;
            min-width: 950px;
        }

        .table thead {
            background: #0d6efd;
            color: white;
        }

        .table thead th {
            padding: 15px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 14px;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #f1f5f9;
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
        }

        .search-btn {
            height: 50px;
            border-radius: 10px;
            padding: 0 25px;
            font-weight: 600;
        }

        .clear-btn {
            height: 50px;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: 600;
        }

        .action-container {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .action-btn {
            width: 42px;
            height: 42px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 8px;

            color: white;

            text-decoration: none;

            border: none;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        /* EDIT BUTTON */

        .edit {
            background: #f39c12;
        }

        .edit:hover {
            background: #d68910;
            color: white;
        }

        /* DELETE BUTTON */

        .delete {
            background: #e74c3c;
        }

        .delete:hover {
            background: #c0392b;
            color: white;
        }

        /* LOGOUT */

        .logout {
            background: #dc3545;
            color: white;
            font-weight: bold;
        }

        .logout:hover {
            background: #bb2d3b;
            color: white;
        }

        /* TOP BAR */

        .top-bar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }

        .welcome {
            color: #dbeafe;

            margin-top: 8px;

            margin-bottom: 0;
        }

        /* SKILL BADGE */

        .badge-skill {
            background: #0d6efd;

            color: white;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;
        }

        /* TRAINING YES */

        .badge-training-yes {
            background: #dc3545;

            color: white;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;
        }

        /* TRAINING NO */

        .badge-training-no {
            background: #198754;

            color: white;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;
        }

        /* EMPTY MESSAGE */

        .empty-message {
            text-align: center;

            padding: 40px;

            color: #64748b;

            font-size: 17px;
        }

        /* EMPLOYEE COUNT */

        .employee-count {
            color: white;

            margin-top: 20px;

            font-size: 15px;
        }

        /* RESPONSIVE */

        @media (max-width: 768px) {

            body {
                padding: 20px;
            }

            .card-box {
                padding: 20px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .top-bar > div:last-child {
                width: 100%;
            }

            .top-bar > div:last-child a {
                margin-bottom: 8px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-btn,
            .clear-btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="container-fluid">

    <div class="card-box">


        <!-- ================================================= -->
        <!-- TOP BAR -->
        <!-- ================================================= -->

        <div class="top-bar">

            <div>

                <h1>

                    <i class="bi bi-people-fill"></i>

                    Employee Skills Summary

                </h1>


                <p class="welcome">

                    Welcome,

                    <strong
                            th:text="${#authentication != null
                            ? #authentication.name
                            : 'Employee'}">

                        Employee

                    </strong>

                </p>

            </div>


            <div>

                <!-- ================================================= -->
                <!-- ADD EMPLOYEE BUTTON -->
                <!-- ================================================= -->

                <a
                        th:href="@{/add}"
                        class="btn btn-info text-white me-2">

                    <i class="bi bi-person-plus-fill"></i>

                    Add Employee

                </a>


                <!-- ================================================= -->
                <!-- LOGOUT BUTTON -->
                <!-- ================================================= -->

                <a
                        th:href="@{/logout}"
                        class="btn logout">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </a>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- SEARCH -->
        <!-- ================================================= -->

        <form
                th:action="@{/dashboard}"
                method="get"
                class="search-box">

            <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    th:value="${keyword}"
                    placeholder="🔍 Search employee by name...">


            <button
                    type="submit"
                    class="btn btn-primary search-btn">

                <i class="bi bi-search"></i>

                Search

            </button>


            <a
                    th:href="@{/dashboard}"
                    class="btn btn-secondary clear-btn">

                <i class="bi bi-x-circle"></i>

                Clear

            </a>

        </form>


        <!-- ================================================= -->
        <!-- EMPLOYEE COUNT -->
        <!-- ================================================= -->

        <p class="employee-count">

            <i class="bi bi-people"></i>

            Total Employees:

            <strong
                    th:text="${employees.size()}">

                0

            </strong>

        </p>


        <!-- ================================================= -->
        <!-- EMPLOYEE TABLE -->
        <!-- ================================================= -->

        <div class="table-container">

            <table class="table table-hover">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Department</th>

                    <th>Skills</th>

                    <th>Skill Level</th>

                    <th>Training Needed</th>

                    <th class="text-center">
                        Actions
                    </th>

                </tr>

                </thead>


                <tbody>


                <!-- ================================================= -->
                <!-- EMPLOYEE ROW -->
                <!-- ================================================= -->

                <tr
                        th:each="employee : ${employees}">


                    <!-- ID -->

                    <td
                            th:text="${employee.id}">

                        1

                    </td>


                    <!-- NAME -->

                    <td>

                        <strong
                                th:text="${employee.name}">

                            Employee Name

                        </strong>

                    </td>


                    <!-- EMAIL -->

                    <td
                            th:text="${employee.email}">

                        employee@gmail.com

                    </td>


                    <!-- DEPARTMENT -->

                    <td
                            th:text="${employee.department}">

                        IT

                    </td>


                    <!-- SKILLS -->

                    <td
                            th:text="${employee.skills}">

                        Java, Spring Boot

                    </td>


                    <!-- SKILL LEVEL -->

                    <td>

                        <span
                                class="badge-skill"
                                th:text="${employee.skillLevel}">

                            Intermediate

                        </span>

                    </td>


                    <!-- ================================================= -->
                    <!-- TRAINING NEEDED -->
                    <!-- ================================================= -->

                    <td>


                        <!-- TRAINING = YES -->

                        <span
                                th:if="${employee.trainingNeeded == 'Yes'}"
                                class="badge-training-yes">

                            <i class="bi bi-exclamation-circle"></i>

                            Yes

                        </span>


                        <!-- TRAINING = NO -->

                        <span
                                th:if="${employee.trainingNeeded == 'No'}"
                                class="badge-training-no">

                            <i class="bi bi-check-circle"></i>

                            No

                        </span>


                    </td>


                    <!-- ================================================= -->
                    <!-- ACTIONS -->
                    <!-- ================================================= -->

                    <td>

                        <div class="action-container">


                            <!-- ================================================= -->
                            <!-- EDIT EMPLOYEE -->
                            <!-- ================================================= -->

                            <a
                                    th:href="@{/edit/{id}(id=${employee.id})}"
                                    class="action-btn edit"
                                    title="Edit Employee">

                                <i class="bi bi-pencil-square"></i>

                            </a>


                            <!-- ================================================= -->
                            <!-- DELETE EMPLOYEE -->
                            <!-- ================================================= -->

                            <a
                                    th:href="@{/delete/{id}(id=${employee.id})}"
                                    class="action-btn delete"
                                    title="Delete Employee"
                                    onclick="return confirmDelete();">

                                <i class="bi bi-trash-fill"></i>

                            </a>


                        </div>

                    </td>


                </tr>


                <!-- ================================================= -->
                <!-- NO EMPLOYEES -->
                <!-- ================================================= -->

                <tr
                        th:if="${employees == null || employees.isEmpty()}">

                    <td
                            colspan="8"
                            class="empty-message">

                        <i
                                class="bi bi-person-x"
                                style="font-size:40px;">
                        </i>

                        <br>

                        <strong>
                            No employees found.
                        </strong>

                        <br>

                        <small>
                            Add an employee to see them here.
                        </small>

                    </td>

                </tr>


                </tbody>

            </table>

        </div>


    </div>

</div>


<!-- ================================================= -->
<!-- DELETE CONFIRMATION -->
<!-- ================================================= -->

<script>

    function confirmDelete() {

        return confirm(
            "Are you sure you want to delete this employee?"
        );

    }

</script>


<!-- ================================================= -->
<!-- BOOTSTRAP JS -->
<!-- ================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
