<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access Denied | Employee Skills Summary</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                    linear-gradient(
                            135deg,
                            #071a49,
                            #1d4ed8,
                            #0f8acb
                    );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .error-card {

            width: 100%;
            max-width: 520px;

            background: white;

            border-radius: 24px;

            padding: 45px 40px;

            text-align: center;

            box-shadow:
                    0 25px 60px
                    rgba(0, 0, 0, 0.25);

        }

        .icon {

            width: 85px;
            height: 85px;

            margin: 0 auto 25px;

            background: #fee2e2;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #dc2626;

            font-size: 45px;

            font-weight: bold;
        }

        .error-code {

            color: #dc2626;

            font-size: 58px;

            font-weight: 800;

            margin-bottom: 5px;
        }

        h1 {

            color: #0f172a;

            font-size: 30px;

            margin-bottom: 15px;
        }

        .message {

            color: #64748b;

            font-size: 16px;

            line-height: 1.7;

            margin-bottom: 30px;
        }

        .info-box {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 30px;

            color: #475569;

            font-size: 14px;

            line-height: 1.6;
        }

        .home-button {

            display: inline-block;

            padding: 13px 28px;

            background:
                    linear-gradient(
                            135deg,
                            #2563eb,
                            #4f46e5
                    );

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 600;

            transition: 0.25s;

            box-shadow:
                    0 6px 15px
                    rgba(37, 99, 235, 0.25);
        }

        .home-button:hover {

            transform: translateY(-2px);

            box-shadow:
                    0 10px 22px
                    rgba(37, 99, 235, 0.35);
        }

        .logout-button {

            display: inline-block;

            margin-left: 10px;

            padding: 13px 28px;

            background: #f1f5f9;

            color: #334155;

            text-decoration: none;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 600;

            transition: 0.25s;
        }

        .logout-button:hover {

            background: #e2e8f0;
        }

        @media (max-width: 600px) {

            .error-card {

                padding: 35px 25px;
            }

            .error-code {

                font-size: 48px;
            }

            h1 {

                font-size: 25px;
            }

            .home-button,
            .logout-button {

                display: block;

                margin: 10px 0;

                width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="error-card">

    <!-- ERROR ICON -->

    <div class="icon">
        !
    </div>


    <!-- ERROR CODE -->

    <div class="error-code">
        403
    </div>


    <!-- TITLE -->

    <h1>
        Access Denied
    </h1>


    <!-- MESSAGE -->

    <p class="message">

        You do not have permission to access this page.

    </p>


    <!-- INFORMATION -->

    <div class="info-box">

        This page is restricted to authorized users.
        <br>

        If you are an employee, please use the
        Employee Dashboard.

    </div>


    <!-- BUTTONS -->

    <a href="/dashboard"
       class="home-button">

        🏠 Go to Dashboard

    </a>


    <a href="/logout"
       class="logout-button">

        Logout

    </a>

</div>

</body>

</html>
