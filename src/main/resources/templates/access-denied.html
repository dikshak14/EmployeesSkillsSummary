<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access Denied | Employee Skills Summary</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 24px;
            padding: 45px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #fee2e2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        h1 {
            color: #1e293b;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .code {
            color: #dc2626;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .dashboard {
            background: #4f46e5;
            color: white;
        }

        .dashboard:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .logout {
            background: #ef4444;
            color: white;
        }

        .logout:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {

            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        🔒
    </div>

    <div class="code">
        403
    </div>

    <h1>
        Access Denied
    </h1>

    <p>
        You do not have permission to access this page.
        This page is restricted to authorized users.
    </p>

    <div class="buttons">

        <a href="/dashboard"
           class="btn dashboard">
            🏠 Go to Dashboard
        </a>

        <a href="/logout"
           class="btn logout">
            🚪 Logout
        </a>

    </div>

</div>

</body>

</html>
